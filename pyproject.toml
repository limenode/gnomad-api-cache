[project]
name = "gnomad-api-cache"
dynamic = ["version"]
description = "Fetch and cache gnomAD annotations for VCF variants."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "cyvcf2>=0.34.0,<0.35",
    "pyarrow>=25.0.0,<26",
    "requests>=2.32,<3",
    "tqdm>=4.66,<5",
]

[project.scripts]
gnomad-api-cache = "gnomad_api_cache.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0,<8",
    "pandas>=3.0.5,<4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version. Read at build time, so __version__
# stays a plain literal and `--version` costs no imports.
[tool.hatch.version]
path = "src/gnomad_api_cache/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomad_api_cache"]
