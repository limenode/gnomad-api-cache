[project]
name = "gnomad-api-cache"
version = "0.1.0"
description = "Fetch and cache gnomAD annotations for VCF variants."
requires-python = ">=3.11"

dependencies = [
    "cyvcf2>=0.34.0,<0.35",
    "requests>=2.32,<3",
    "tqdm>=4.66,<5",
]

# to_parquet imports pyarrow lazily, so JSON and CSV/TSV export work without it.
[project.optional-dependencies]
parquet = ["pyarrow>=25.0.0,<26"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0,<8",
    "pandas>=3.0.5,<4",
    "basedpyright>=1.39,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomad_api_cache"]
