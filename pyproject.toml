[project]
name = "gnomad-api-caller"
version = "0.1.0"
description = "Fetch and cache gnomAD annotations for VCF variants."
requires-python = ">=3.14,<3.15"
# Runtime dependencies (cyvcf2, requests) come from the conda environment
# declared in pixi.toml, so nothing is listed here for pip to resolve.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnomad_api_caller"]
